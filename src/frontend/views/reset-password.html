<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVision - Redefinir Senha</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assets/icons/icon-stockVision.png" type="image/png">
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/authGuard.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors">
    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 shadow-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </div>

    <main class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary-50 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 mb-3 shadow-inner">
                    <i class="bi bi-shield-lock-fill text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Redefinir Senha</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Crie uma nova credencial segura para a sua conta corporativa</p>
            </div>

            <!-- Formulário de Nova Senha -->
            <form id="reset-form" class="space-y-4">
                <div>
                    <label for="new-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
                        Nova Senha <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="new-password" required minlength="6" placeholder="Mínimo de 6 caracteres"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
                        Confirmar Nova Senha <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="bi bi-check-circle absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="confirm-password" required minlength="6" placeholder="Repita a nova senha"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>

                <!-- Indicador de Requisitos -->
                <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-[11px] text-slate-600 dark:text-slate-300 space-y-1">
                    <p class="font-semibold text-slate-700 dark:text-slate-200">Recomendações de Segurança:</p>
                    <p>• Mínimo de 6 caracteres (recomendado 8+ letras e números)</p>
                    <p>• Evite dados pessoais ou sequências óbvias</p>
                </div>

                <button type="submit" id="reset-submit-btn"
                    class="w-full py-3 px-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 mt-2">
                    <span>Confirmar e Salvar Nova Senha</span>
                    <i class="bi bi-check-lg"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-700/60 text-center">
                <a href="login.html" class="text-xs text-slate-500 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 transition font-medium">
                    <i class="bi bi-arrow-left mr-1"></i> Voltar para a tela de login
                </a>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/core/uiFeedback.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                ui.toast('Token de redefinição não informado ou link corrompido.', 'danger');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            const form = document.getElementById('reset-form');
            const submitBtn = document.getElementById('reset-submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword !== confirmPassword) {
                    ui.toast('Atenção: As duas senhas digitadas não coincidem!', 'warning');
                    return;
                }

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⟳</span> Atualizando Senha...';

                    const response = await AuthAPI.resetPassword(token, newPassword);
                    ui.toast(response.message || 'Senha redefinida com sucesso!', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } catch (error) {
                    ui.toast(error.message || 'Erro ao redefinir senha. O link pode ter expirado.', 'danger', 6000);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Confirmar e Salvar Nova Senha</span> <i class="bi bi-check-lg"></i>';
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVision - Acesse sua Conta</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assets/icons/icon-stockVision.png" type="image/png">
    <!-- Scripts essenciais no head para evitar FOUC e redirecionar se já autenticado -->
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/authGuard.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors">
    <!-- Botão de Tema no Topo -->
    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 shadow-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </div>

    <!-- Card de Login -->
    <main class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-6 sm:p-8">
            <!-- Cabeçalho / Logo -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center p-2 mb-2">
                    <img src="../assets/icons/icon-stockVision.png" alt="StockVision" class="w-20 h-20 object-contain drop-shadow">
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Acesse sua conta</h1>
                <p class="text-emerald-600 dark:text-emerald-400 font-medium text-xs mt-1">Veja o futuro. Controle o resultado.</p>
            </div>

            <!-- Formulário -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
                        E-mail Corporativo <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="bi bi-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="email" required placeholder="gestor@empresa.com.br"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                            Senha <span class="text-rose-500">*</span>
                        </label>
                        <button type="button" id="open-forgot-modal" class="text-xs font-medium text-primary-600 dark:text-primary-400 hover:underline">
                            Esqueceu a senha?
                        </button>
                    </div>
                    <div class="relative">
                        <i class="bi bi-shield-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <button type="submit" id="login-submit-btn"
                    class="w-full py-3 px-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                    <span>Entrar no Sistema</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <!-- Rodapé do Card -->
            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-700/60 text-center">
                <p class="text-xs text-slate-500 dark:text-slate-400">
                    Sua empresa ainda não possui conta?
                    <a href="register.html" class="text-primary-600 dark:text-primary-400 font-bold hover:underline ml-1">
                        Cadastre sua organização
                    </a>
                </p>
            </div>
        </div>
    </main>

    <!-- Modal: Recuperação de Senha (Esqueci minha Senha) -->
    <div id="forgot-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden transition-opacity duration-200 opacity-0">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 max-w-md w-full p-6 transform scale-95 transition-transform duration-200">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-primary-50 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 flex items-center justify-center">
                        <i class="bi bi-key-fill text-lg"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white">Recuperação de Acesso</h3>
                </div>
                <button type="button" id="close-forgot-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg leading-none">&times;</button>
            </div>

            <p class="text-xs text-slate-600 dark:text-slate-300 mb-4 leading-relaxed">
                Informe o seu e-mail corporativo cadastrado. Enviaremos um link seguro para você redefinir sua credencial de acesso.
            </p>

            <form id="forgot-form" class="space-y-4">
                <div>
                    <label for="forgot-email" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                        E-mail de Cadastro
                    </label>
                    <input type="email" id="forgot-email" required placeholder="seu@email.com"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>

                <div class="flex items-center justify-end gap-2.5 pt-2">
                    <button type="button" id="cancel-forgot-modal" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                        Cancelar
                    </button>
                    <button type="submit" id="forgot-submit-btn" class="px-4 py-2 text-xs font-semibold bg-primary-600 hover:bg-primary-700 text-white rounded-xl shadow transition flex items-center gap-2">
                        <span>Gerar Link de Recuperação</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts da Camada de Controle -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/core/uiFeedback.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const submitBtn = document.getElementById('login-submit-btn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⟳</span> Autenticando...';
                    
                    const response = await AuthAPI.login(email, password);
                    ui.toast(response.message || 'Login efetuado com sucesso!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } catch (error) {
                    ui.toast(error.message || 'Credenciais inválidas.', 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Entrar no Sistema</span> <i class="bi bi-arrow-right"></i>';
                }
            });

            // Gerenciador do Modal Esqueci Minha Senha
            const forgotModal = document.getElementById('forgot-modal');
            const openForgotBtn = document.getElementById('open-forgot-modal');
            const closeForgotBtn = document.getElementById('close-forgot-modal');
            const cancelForgotBtn = document.getElementById('cancel-forgot-modal');
            const forgotForm = document.getElementById('forgot-form');
            const forgotSubmitBtn = document.getElementById('forgot-submit-btn');

            const toggleForgotModal = (show) => {
                if (show) {
                    forgotModal.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        forgotModal.classList.remove('opacity-0');
                        forgotModal.classList.add('opacity-100');
                        forgotModal.querySelector('div').classList.remove('scale-95');
                        forgotModal.querySelector('div').classList.add('scale-100');
                    });
                } else {
                    forgotModal.classList.remove('opacity-100');
                    forgotModal.classList.add('opacity-0');
                    forgotModal.querySelector('div').classList.remove('scale-100');
                    forgotModal.querySelector('div').classList.add('scale-95');
                    setTimeout(() => forgotModal.classList.add('hidden'), 200);
                }
            };

            openForgotBtn.addEventListener('click', () => toggleForgotModal(true));
            closeForgotBtn.addEventListener('click', () => toggleForgotModal(false));
            cancelForgotBtn.addEventListener('click', () => toggleForgotModal(false));

            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('forgot-email').value.trim();

                try {
                    forgotSubmitBtn.disabled = true;
                    forgotSubmitBtn.innerText = 'Processando...';

                    const res = await AuthAPI.forgotPassword(email);
                    toggleForgotModal(false);
                    ui.toast(res.message, 'success', 6000);

                    // Se ambiente local/simulado, exibe modal com o link para facilidade de testes
                    if (res.resetUrl) {
                        setTimeout(async () => {
                            const goToReset = await ui.confirm({
                                title: 'Link de Redefinição Gerado',
                                message: `Um link de segurança foi gerado com sucesso. Deseja ir diretamente para a tela de redefinição de senha?`,
                                confirmText: 'Abrir Redefinição',
                                cancelText: 'Ficar no Login'
                            });
                            if (goToReset) {
                                window.location.href = res.resetUrl;
                            }
                        }, 600);
                    }
                } catch (err) {
                    ui.toast(err.message || 'Erro ao processar solicitação.', 'danger');
                } finally {
                    forgotSubmitBtn.disabled = false;
                    forgotSubmitBtn.innerText = 'Gerar Link de Recuperação';
                }
            });
        });
    </script>
</body>
</html>
